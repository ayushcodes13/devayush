<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Tender Review evidence workflow</title>
  <desc id="desc">A text-based tender PDF is read page by page. Candidate clauses are found, matched against selectable text and page geometry, presented for human review, then exported as blank OEM response fields in a DOCX. The system does not decide supplier compliance or claim complete coverage.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091a32"/><stop offset="1" stop-color="#142c4c"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#56a9ff"/><stop offset="1" stop-color="#42d7c1"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#030e1f" flood-opacity=".38"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#84bbff" stroke-width="2"/></marker></defs>
  <rect width="1440" height="810" rx="28" fill="url(#bg)"/><circle cx="1290" cy="110" r="220" fill="#4f9eff" opacity=".08"/><text x="82" y="90" fill="#79c6ff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">TENDER REVIEW · EVIDENCE FLOW</text><text x="82" y="151" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">From a PDF clause to a reviewable response sheet</text><text x="82" y="191" fill="#a9bdd3" font-family="Inter,Arial,sans-serif" font-size="19">A source match earns a closer look; a human reviewer still owns the decision.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="82" y="288" width="236" height="210" rx="20" fill="#10243d" stroke="#335274"/><rect x="82" y="288" width="236" height="8" rx="4" fill="#56a9ff"/><text x="108" y="336" fill="#79c6ff" font-size="14" font-weight="700" letter-spacing="1.7">01 · DOCUMENT</text><text x="108" y="382" fill="#f4f8ff" font-size="22" font-weight="700">Text-based PDF</text><text x="108" y="420" fill="#b9c9dc" font-size="16">Selectable page text</text><text x="108" y="450" fill="#b9c9dc" font-size="16">Page by page</text><text x="108" y="478" fill="#728ca7" font-size="14">Scanned PDFs unsupported</text>
    <rect x="368" y="288" width="236" height="210" rx="20" fill="#10243d" stroke="#335274"/><rect x="368" y="288" width="236" height="8" rx="4" fill="#728bff"/><text x="394" y="336" fill="#a2b0ff" font-size="14" font-weight="700" letter-spacing="1.7">02 · FIND</text><text x="394" y="382" fill="#f4f8ff" font-size="22" font-weight="700">Candidate clause</text><text x="394" y="420" fill="#b9c9dc" font-size="16">Rule-based preview</text><text x="394" y="450" fill="#b9c9dc" font-size="16">Optional model path</text><text x="394" y="478" fill="#728ca7" font-size="14">May miss or include clauses</text>
    <rect x="654" y="288" width="236" height="210" rx="20" fill="#10243d" stroke="#335274"/><rect x="654" y="288" width="236" height="8" rx="4" fill="#f3bd58"/><text x="680" y="336" fill="#ffd178" font-size="14" font-weight="700" letter-spacing="1.7">03 · MATCH</text><text x="680" y="382" fill="#f4f8ff" font-size="22" font-weight="700">Quote + geometry</text><text x="680" y="420" fill="#b9c9dc" font-size="16">Match to cited page text</text><text x="680" y="450" fill="#b9c9dc" font-size="16">PDF.js positions highlight</text><text x="680" y="478" fill="#728ca7" font-size="14">Unmatched ≠ verified</text>
    <rect x="940" y="288" width="236" height="210" rx="20" fill="#10243d" stroke="#335274"/><rect x="940" y="288" width="236" height="8" rx="4" fill="#42cbb5"/><text x="966" y="336" fill="#62ddc6" font-size="14" font-weight="700" letter-spacing="1.7">04 · REVIEW</text><text x="966" y="382" fill="#f4f8ff" font-size="22" font-weight="700">Human check</text><text x="966" y="420" fill="#b9c9dc" font-size="16">Compare quote and page</text><text x="966" y="450" fill="#b9c9dc" font-size="16">Candidate starts Needs review</text><text x="966" y="478" fill="#728ca7" font-size="14">No compliance verdict</text>
    <rect x="1226" y="288" width="132" height="210" rx="20" fill="#10243d" stroke="#335274"/><rect x="1226" y="288" width="132" height="8" rx="4" fill="#56a9ff"/><text x="1248" y="336" fill="#79c6ff" font-size="14" font-weight="700" letter-spacing="1.5">05 · EXPORT</text><text x="1248" y="382" fill="#f4f8ff" font-size="21" font-weight="700">DOCX</text><text x="1248" y="420" fill="#b9c9dc" font-size="15">Tender text</text><text x="1248" y="448" fill="#b9c9dc" font-size="15">Blank OEM</text><text x="1248" y="476" fill="#b9c9dc" font-size="15">response</text>
  </g>
  <g fill="none" stroke="#84bbff" stroke-width="3" marker-end="url(#arrow)"><path d="M324 393h37"/><path d="M610 393h37"/><path d="M896 393h37"/><path d="M1182 393h37"/></g>
  <rect x="82" y="572" width="1276" height="126" rx="18" fill="#0b1e34" stroke="#4e6f8a"/><text x="114" y="615" fill="#ffd178" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">CURRENT HOSTED MVP BOUNDARY</text><text x="114" y="655" fill="#e5edf8" font-family="Inter,Arial,sans-serif" font-size="19">Single Next.js app · browser holds the active review · no sign-in or saved review history</text><text x="82" y="758" fill="#7f94aa" font-family="Inter,Arial,sans-serif" font-size="15">Always check the original tender for omissions before using the exported sheet. Candidate count is not a completeness measure.</text>
</svg>
