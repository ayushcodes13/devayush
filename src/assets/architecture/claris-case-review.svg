<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CLARIS case-review architecture</title>
  <desc id="desc">Case intake becomes a normalized PatientCase, moves through a persisted LangGraph review with clinical, imaging, longitudinal, and evidence specialists, then deterministic validation and a clinician-review checkpoint. The React workstation displays saved artifacts; optional Foundry steps stay inside an allowlist.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071e2e"/><stop offset="1" stop-color="#10394b"/></linearGradient><linearGradient id="mint" x2="1"><stop stop-color="#4ed0b4"/><stop offset="1" stop-color="#70b8f5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00121c" flood-opacity=".36"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#8ce0d0" stroke-width="2"/></marker></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><circle cx="1270" cy="120" r="210" fill="#54d2bb" opacity=".08"/><text x="76" y="78" fill="#6ed8c6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">CLARIS · CASE REVIEW</text><text x="76" y="135" fill="#f2fbff" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">A traceable investigation, with a clinician in the loop</text><text x="76" y="174" fill="#9fc0cc" font-family="Inter,Arial,sans-serif" font-size="19">Specialist review is checkpointed; findings are validated before the assessment is presented.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="76" y="244" width="250" height="170" rx="18" fill="#0c2a3a" stroke="#286477"/><rect x="76" y="244" width="250" height="7" rx="3" fill="#72b8f5"/><text x="100" y="286" fill="#83c4f3" font-size="14" font-weight="700" letter-spacing="1.6">01 · INTAKE</text><text x="100" y="328" fill="#f5fbff" font-size="22" font-weight="700">Case + context</text><text x="100" y="360" fill="#b5ccd5" font-size="16">Normalize available records</text><text x="100" y="386" fill="#829daa" font-size="14">Track missing fields explicitly</text>
    <rect x="382" y="244" width="292" height="170" rx="18" fill="#0c2a3a" stroke="#286477"/><rect x="382" y="244" width="292" height="7" rx="3" fill="url(#mint)"/><text x="406" y="286" fill="#69d8c5" font-size="14" font-weight="700" letter-spacing="1.6">02 · ORCHESTRATE</text><text x="406" y="328" fill="#f5fbff" font-size="22" font-weight="700">LangGraph review</text><text x="406" y="360" fill="#b5ccd5" font-size="16">Persisted state · bounded retries</text><text x="406" y="386" fill="#829daa" font-size="14">Resume after interruption</text>
    <rect x="740" y="222" width="300" height="214" rx="18" fill="#0c2a3a" stroke="#286477"/><rect x="740" y="222" width="300" height="7" rx="3" fill="#53c9b4"/><text x="764" y="264" fill="#69d8c5" font-size="14" font-weight="700" letter-spacing="1.6">03 · SPECIALISTS</text><text x="764" y="306" fill="#f5fbff" font-size="21" font-weight="700">Investigation passes</text><text x="764" y="346" fill="#b5ccd5" font-size="16">Clinical context</text><text x="764" y="374" fill="#b5ccd5" font-size="16">Imaging + longitudinal review</text><text x="764" y="402" fill="#b5ccd5" font-size="16">Controlled-corpus evidence</text>
    <rect x="1106" y="244" width="258" height="170" rx="18" fill="#0c2a3a" stroke="#286477"/><rect x="1106" y="244" width="258" height="7" rx="3" fill="#f4b35f"/><text x="1130" y="286" fill="#ffc36d" font-size="14" font-weight="700" letter-spacing="1.6">04 · VALIDATE</text><text x="1130" y="328" fill="#f5fbff" font-size="22" font-weight="700">Rules + claim trace</text><text x="1130" y="360" fill="#b5ccd5" font-size="16">Deterministic checks</text><text x="1130" y="386" fill="#829daa" font-size="14">Source IDs stay attached</text>
    <rect x="382" y="532" width="420" height="158" rx="18" fill="#0c2a3a" stroke="#286477"/><text x="408" y="574" fill="#83c4f3" font-size="14" font-weight="700" letter-spacing="1.6">OPTIONAL · AZURE AI FOUNDRY</text><text x="408" y="615" fill="#f5fbff" font-size="21" font-weight="700">Allowlisted action choice or draft wording</text><text x="408" y="648" fill="#b5ccd5" font-size="16">Cannot replace the canonical decision</text><text x="408" y="674" fill="#829daa" font-size="14">Opt-in and bounded by readiness policy</text>
    <rect x="860" y="532" width="504" height="158" rx="18" fill="#123a3d" stroke="#388f80"/><rect x="860" y="532" width="7" height="158" rx="3" fill="#55d4bd"/><text x="890" y="574" fill="#6fe0ca" font-size="14" font-weight="700" letter-spacing="1.6">05 · HUMAN REVIEW</text><text x="890" y="615" fill="#f5fbff" font-size="22" font-weight="700">Checkpoint before disposition</text><text x="890" y="648" fill="#c2dfdc" font-size="16">Evidence · missing data · conflicts · flags</text><text x="890" y="674" fill="#8bb7b3" font-size="14">Research prototype · no diagnosis or treatment advice</text>
  </g>
  <g fill="none" stroke="#8ce0d0" stroke-width="3" marker-end="url(#arrow)"><path d="M332 329h43"/><path d="M680 329h48"/><path d="M1046 329h49"/><path d="M1236 422v80h-106"/><path d="M802 611h50"/><path d="M530 420v99"/></g>
  <path d="M520 489h720" fill="none" stroke="#557887" stroke-width="2" stroke-dasharray="8 9"/><text x="78" y="776" fill="#a5bcc8" font-family="Inter,Arial,sans-serif" font-size="17">Frontend workstation</text><text x="78" y="807" fill="#76929f" font-family="Inter,Arial,sans-serif" font-size="15">Hosted demo reads prepared checkpoint artifacts · uploads and persisted review jobs require the local API</text><rect x="78" y="831" width="1286" height="2" rx="1" fill="#3d6470" opacity=".7"/>
</svg>
