<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Atlas browser-side data flow</title>
  <desc id="desc">A static campaign dashboard reads bundled synthetic or user-selected CSV data in the browser, validates and filters it, then calculates visible metrics and charts without a server or model call.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#172640"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#8b7bff"/><stop offset="1" stop-color="#49c6b2"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#9eafff" stroke-width="2"/></marker></defs>
  <rect width="1440" height="810" rx="28" fill="url(#bg)"/><circle cx="1270" cy="130" r="190" fill="#7067ff" opacity=".09"/><circle cx="130" cy="760" r="210" fill="#35c6b1" opacity=".08"/>
  <text x="84" y="92" fill="#69d5c3" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">ATLAS · SYSTEM MAP</text><text x="84" y="151" fill="#f5f7ff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">A small analytics loop, kept in the browser</text><text x="84" y="191" fill="#a8b6cc" font-family="Inter,Arial,sans-serif" font-size="20">Synthetic sample or local CSV → validated rows → filtered calculations → dashboard</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="86" y="292" width="250" height="214" rx="20" fill="#111f34" stroke="#324764"/><rect x="86" y="292" width="250" height="8" rx="4" fill="#8b7bff"/><text x="114" y="342" fill="#9eafff" font-size="15" font-weight="700" letter-spacing="2">01 · INPUT</text><text x="114" y="387" fill="#f4f6ff" font-size="23" font-weight="700">CSV source</text><text x="114" y="425" fill="#b9c5d8" font-size="17">Bundled synthetic sample</text><text x="114" y="454" fill="#b9c5d8" font-size="17">or selected local file</text><text x="114" y="482" fill="#71839f" font-size="14">No upload endpoint</text>
    <rect x="408" y="292" width="250" height="214" rx="20" fill="#111f34" stroke="#324764"/><rect x="408" y="292" width="250" height="8" rx="4" fill="#7d91ff"/><text x="436" y="342" fill="#a6b5ff" font-size="15" font-weight="700" letter-spacing="2">02 · PARSE</text><text x="436" y="387" fill="#f4f6ff" font-size="23" font-weight="700">Validate rows</text><text x="436" y="425" fill="#b9c5d8" font-size="17">Required columns</text><text x="436" y="454" fill="#b9c5d8" font-size="17">Types and count checks</text><text x="436" y="482" fill="#71839f" font-size="14">Invalid file shows an error</text>
    <rect x="730" y="292" width="250" height="214" rx="20" fill="#111f34" stroke="#324764"/><rect x="730" y="292" width="250" height="8" rx="4" fill="#59c9b4"/><text x="758" y="342" fill="#67d8c3" font-size="15" font-weight="700" letter-spacing="2">03 · EXPLORE</text><text x="758" y="387" fill="#f4f6ff" font-size="23" font-weight="700">Filter in memory</text><text x="758" y="425" fill="#b9c5d8" font-size="17">Date · channel · search</text><text x="758" y="454" fill="#b9c5d8" font-size="17">Current rows drive the view</text><text x="758" y="482" fill="#71839f" font-size="14">Refresh clears imported rows</text>
    <rect x="1052" y="292" width="300" height="214" rx="20" fill="#111f34" stroke="#324764"/><rect x="1052" y="292" width="300" height="8" rx="4" fill="url(#accent)"/><text x="1080" y="342" fill="#70d7c5" font-size="15" font-weight="700" letter-spacing="2">04 · PRESENT</text><text x="1080" y="387" fill="#f4f6ff" font-size="23" font-weight="700">Dashboard</text><text x="1080" y="425" fill="#b9c5d8" font-size="17">Revenue · conversions · ROAS</text><text x="1080" y="454" fill="#b9c5d8" font-size="17">Trend · channel · campaign table</text><text x="1080" y="482" fill="#71839f" font-size="14">Calculated from visible rows</text>
  </g>
  <g fill="none" stroke="#9eafff" stroke-width="3" marker-end="url(#arrow)"><path d="M342 399h56"/><path d="M664 399h56"/><path d="M986 399h56"/></g>
  <rect x="86" y="574" width="1266" height="134" rx="18" fill="#0b192a" stroke="#31574f"/><circle cx="124" cy="621" r="8" fill="#55d3bd"/><text x="150" y="628" fill="#76dcca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">BOUNDARY</text><text x="124" y="670" fill="#e5edf7" font-family="Inter,Arial,sans-serif" font-size="20">Static demo only: no AI call, live ad-platform connection, backend, account, or saved report.</text><text x="84" y="768" fill="#75869e" font-family="Inter,Arial,sans-serif" font-size="15">Imported data stays on this page in browser memory; use synthetic or non-confidential files.</text>
</svg>
